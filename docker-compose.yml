version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: iteh_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: evidencija_radova
      MYSQL_USER: user123
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build: .
    container_name: iteh_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://user123:password123@db:3306/evidencija_radova"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data: